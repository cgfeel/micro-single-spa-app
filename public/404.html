<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      ;(function () {
        const path = window.location.pathname + window.location.search + window.location.hash
        const basePath = '/micro-single-spa-app'
        window.location.replace(
          `${basePath}/index.html?redirect=${encodeURIComponent(path.startsWith(basePath) ? path.slice(basePath.length) : path)}`
        )
      })()
    </script>
  </head>
  <body></body>
</html>
